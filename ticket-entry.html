<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>New Ticket — Voyager ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link href="assets/css/design-system.css" rel="stylesheet" />
<link href="assets/css/app.css" rel="stylesheet" />
<style>
  /* Scoped to this page only — locks the outer page to the viewport so
     the browser's own scrollbar can never appear, regardless of content.
     The sidebar keeps its own internal scroll (unaffected, unchanged). */
  html, body { height: 100%; overflow: hidden; margin: 0; }
</style>
</head><body>
<header class="app-topnav" id="shell-topnav"></header>
<div class="app-body" style="height: calc(100vh - var(--topnav-height));">
  <aside class="app-sidebar" id="shell-sidebar"></aside>
  <main class="app-main" style="max-width:1500px; padding:16px 20px; display:flex; flex-direction:column; height:calc(100vh - var(--topnav-height)); overflow:hidden;">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:0.6rem; flex-shrink:0;">
      <div style="display:flex; align-items:center; gap:0.5rem;">
        <h1 style="font-size:1.15rem; margin:0;" id="page-title">New Airline Ticket</h1>
      </div>
      <div style="display:flex; gap:0.5rem; flex-shrink:0;">
        <a href="tickets.html" class="btn-outline-brand" id="cancel-link">Discard</a>
        <button type="submit" form="ticket-form" class="btn-brand" id="submit-btn">Save Ticket</button>
      </div>
    </div>

    <form id="ticket-form" style="display:flex; flex-direction:column; flex:1; min-height:0;">

      <div class="section-title" style="margin-bottom:10px; flex-shrink:0;">Booking Details</div>
      <div class="compact-grid" style="flex-shrink:0;">
        <div><label class="field-label">Invoice Number<span class="req-star">*</span></label><input class="form-control-custom" id="invoice_number" maxlength="20" required /><div class="field-hint" id="invoice_number_hint"></div></div>
        <div><label class="field-label">Invoice Date<span class="req-star">*</span></label>
          <div class="date-group" id="invoice_date">
            <input class="dg-dd" inputmode="numeric" maxlength="2" placeholder="dd" />
            <span class="dg-sep">-</span>
            <input class="dg-mm" inputmode="numeric" maxlength="2" placeholder="mm" />
            <span class="dg-sep">-</span>
            <input class="dg-yyyy" inputmode="numeric" maxlength="4" placeholder="yyyy" />
          </div>
          <div class="field-hint" id="invoice_date_hint"></div>
        </div>
        <div><label class="field-label">Invoice Type</label><select class="form-control-custom" id="invoice_type"></select></div>
        <div><label class="field-label">Booking Mode</label><div class="computed-field" id="booking_mode"></div></div>
        <div><label class="field-label">Booking Type</label><select class="form-control-custom" id="booking_type"></select></div>
        <div><label class="field-label">Booking Status</label><select class="form-control-custom" id="booking_status"></select></div>
        <div><label class="field-label">Travel Type</label><select class="form-control-custom" id="travel_type"></select></div>
        <div><label class="field-label">User Name</label><select class="form-control-custom" id="user_name"></select></div>
        <div><label class="field-label">Payment Mode</label><select class="form-control-custom" id="payment_mode"></select></div>
        <div><label class="field-label">Airline Category</label><select class="form-control-custom" id="airline_category"></select></div>
        <div><label class="field-label">Currency</label><div class="computed-field" id="currency">—</div></div>
        <div><label class="field-label">ROE</label><input class="form-control-custom" type="number" id="roe" min="0" step="0.0001" placeholder="1.0000" /></div>
        <div><label class="field-label">Booking Given By</label><input class="form-control-custom" id="booking_given_by" maxlength="25" /></div>

        <div><label class="field-label">Customer Name<span class="req-star">*</span></label><input class="form-control-custom" id="customer" list="customer-options" placeholder="Type to search…" autocomplete="off" required /><datalist id="customer-options"></datalist><div class="field-hint" id="customer_hint"></div></div>
        <div><label class="field-label">Customer Code</label><div class="computed-field" id="customer_code">—</div></div>
        <div><label class="field-label">Customer Address</label><div class="computed-field" id="customer_address">—</div></div>
        <div><label class="field-label">Customer GST/TRN No</label><div class="computed-field" id="customer_gst">—</div></div>

        <div><label class="field-label">Supplier<span class="req-star">*</span></label><input class="form-control-custom" id="supplier" list="supplier-options" placeholder="Type to search…" autocomplete="off" required /><datalist id="supplier-options"></datalist><div class="field-hint" id="supplier_hint"></div></div>
        <div><label class="field-label">Office ID</label><input class="form-control-custom" id="office_id" placeholder="e.g. OFF-001" /></div>
        <div><label class="field-label">Booking Reference<span class="req-star">*</span></label><input class="form-control-custom" id="booking_reference" required /><div class="field-hint" id="booking_reference_hint"></div></div>
        <div><label class="field-label">Booking Ref Date<span class="req-star">*</span></label>
          <div class="date-group" id="booking_ref_date">
            <input class="dg-dd" inputmode="numeric" maxlength="2" placeholder="dd" />
            <span class="dg-sep">-</span>
            <input class="dg-mm" inputmode="numeric" maxlength="2" placeholder="mm" />
            <span class="dg-sep">-</span>
            <input class="dg-yyyy" inputmode="numeric" maxlength="4" placeholder="yyyy" />
          </div>
          <div class="field-hint" id="booking_ref_date_hint"></div>
        </div>
        <div><label class="field-label">Airline PNR</label><input class="form-control-custom" id="airline_pnr_header" maxlength="13" /></div>
        <div><label class="field-label">GDS PNR</label><input class="form-control-custom" id="gds_pnr_header" maxlength="13" /></div>
      </div>

      <div class="section-title" style="margin:8px 0 4px; font-size:13px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0;">
        <span>Passengers &amp; Fare Breakup</span>
        <span id="pax-count" class="text-muted-custom" style="font-size:12px; font-weight:600; margin-right:2px;">0 Passengers</span>
        <button type="button" class="btn-outline-brand" id="add-line-btn" style="font-size:11px; padding:0.25rem 0.6rem;">+ Add Passenger</button>
      </div>

      <div class="pax-table-wrap" style="flex:0 1 auto; min-height:0; overflow-y:auto;">
        <table class="pax-table">
          <thead>
            <tr>
              <th>#</th><th>Airline Code</th><th>Airline Name</th><th>Flight No</th>
              <th>Ticket No<span class="req-star">*</span></th><th>Pax Name<span class="req-star">*</span></th><th>Pax Type</th>
              <th>Sector</th><th>Travel Date</th><th>Basic Fare</th><th>Markup</th>
              <th>Service Fee</th><th>GST %</th><th>Total</th><th></th><th></th>
            </tr>
          </thead>
          <tbody id="ticket-lines"></tbody>
        </table>
      </div>

      <div class="compact-grid" style="border-top:1px solid var(--color-border); margin-top:6px; padding-top:6px; max-width:220px; margin-left:auto; flex-shrink:0;">
        <div><label class="field-label">Invoice Total (all passengers)</label><div class="computed-field" id="invoice_total" style="font-size:1.05rem;">—</div></div>
      </div>
    </form>
  </main>
</div>


<script src="assets/js/hardcode.js"></script>
<script src="assets/js/mock-data.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/shell.js?v=6"></script>
<script src="assets/js/entry-common.js"></script>
<script src="assets/js/page-ticket-entry.js?v=3"></script>
</body></html>
