services:
  - type: web
    name: voyager-accounting-api
    runtime: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: DB_SSL
        value: "True"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false

  - type: static
    name: voyager-erp-frontend
    buildCommand: ""
    staticPublishPath: frontend
    routes:
      - type: rewrite
        source: /api/*
        destination: https://voyager-erp.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
